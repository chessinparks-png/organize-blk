<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ORGANIZE</title>
  <meta name="description" content="A minimalist historical narrative game about Black organizing in the United States.">
  <meta name="theme-color" content="#0b0b0a">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ORGANIZE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip sr-only-focusable" href="#main">Skip to content</a>
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <main id="main">
    <section id="view-home" class="view view-home" aria-label="Home" hidden></section>
    <section id="view-stories" class="view view-page" aria-label="Stories" hidden></section>
    <section id="view-about" class="view view-page" aria-label="About" hidden></section>

    <section id="view-play" class="view view-play" aria-label="Story" hidden>
      <header class="topbar">
        <button id="menu-btn" class="icon-btn" type="button" aria-label="Story menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        </button>
        <p id="top-story" class="top-story"></p>
        <ol id="top-campaign" class="campaign top-campaign"></ol>
        <p id="top-xp" class="top-xp"></p>
        <div class="beat-track" aria-hidden="true"><span id="beat-bar" class="beat-bar"></span></div>
      </header>
      <div id="stage" class="stage"></div>
      <footer class="play-foot">
        <button id="next" class="next" type="button">
          <span class="next-label">CONTINUE</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </footer>
    </section>

    <section id="view-ending" class="view view-ending" aria-label="Ending" hidden></section>
  </main>

  <dialog id="dlg-menu" class="dlg" aria-label="Story menu"></dialog>
  <dialog id="dlg-confirm" class="dlg" aria-label="Reset progress"></dialog>
  <dialog id="dlg-look" class="dlg dlg-sheet" aria-label="Look closer"></dialog>

  <noscript><p class="noscript">ORGANIZE needs JavaScript to run.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
